name: openssh-build

# 每日自动检查 OpenSSH 最新 portable 版本并构建；也可手动指定版本触发。
# 架构：x86_64（全部发行版）+ aarch64（Ubuntu 18.04 / 20.04 / 22.04 / 24.04）。
on:
  workflow_dispatch:
    inputs:
      openssh_version:
        description: "OpenSSH 版本 X.YpZ（留空 = 自动解析最新版本，如 10.6p2）"
        required: false
        type: string
      force:
        description: "即使 Release 已存在也强制重建"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: openssh-build
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析版本并校验源码
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      openssh_version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析 OpenSSH 最新版本
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openssh_version }}
        run: |
          set -euo pipefail
          version="$(bash scripts/resolve-openssh-version.sh "$INPUT_VERSION")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OpenSSH 目标版本: $version"

      - name: 检查 Release 是否已存在
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "openssh-$VERSION" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "### OpenSSH $VERSION 已发布，跳过构建" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "### 准备构建 OpenSSH $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 下载并校验源码（GPG 验签 + SHA256 锁定）
        if: steps.check.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/prepare-sources.sh "$GITHUB_WORKSPACE/work" \
            "$GITHUB_WORKSPACE/lock/openssh.lock.json" "$VERSION" openssh
          cat work/source-metadata.json

      - name: 上传已验签源码
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: |
            work/sources/
            work/openssh.lock.resolved.json
            work/source-metadata.json
          retention-days: 7
          if-no-files-found: error

  build:
    name: 构建 (${{ matrix.distro }}-${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- x86_64 ----------
          - distro: ubuntu18.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:18.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu20.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:20.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu22.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:22.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu24.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:24.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: centos7
            arch: x86_64
            runner: ubuntu-latest
            base_image: centos:7
            dockerfile: docker/build/openssh-centos7.Dockerfile
          - distro: rocky9
            arch: x86_64
            runner: ubuntu-latest
            base_image: rockylinux:9
            dockerfile: docker/build/openssh-rocky9.Dockerfile
          # ---------- aarch64（Ubuntu 18.04 - 24.04） ----------
          - distro: ubuntu18.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:18.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu20.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:20.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu22.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:22.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
          - distro: ubuntu24.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:24.04
            dockerfile: docker/build/openssh-ubuntu.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: work

      - name: 拉取基础镜像（带镜像站回退）
        run: |
          set -euo pipefail
          image="${{ matrix.base_image }}"
          if ! docker pull "$image"; then
            mirror_image="mirror.gcr.io/library/${image#docker.io/library/}"
            echo "Docker Hub 拉取失败，回退到 $mirror_image"
            docker pull "$mirror_image"
            docker tag "$mirror_image" "$image"
          fi

      - name: 构建工具链镜像
        run: |
          set -euo pipefail
          docker build \
            -f "${{ matrix.dockerfile }}" \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            -t "trust-binary/openssh-build:${{ matrix.distro }}" \
            .

      - name: 编译 OpenSSH
        env:
          VERSION: ${{ needs.resolve.outputs.openssh_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          openssl_ver="$(python3 scripts/lockfile.py get work/openssh.lock.resolved.json openssl version)"
          zlib_ver="$(python3 scripts/lockfile.py get work/openssh.lock.resolved.json zlib version)"
          docker run --rm --network none \
            -v "$PWD/work/sources:/sources:ro" \
            -v "$PWD/dist:/out" \
            -e OPENSSH_VERSION="$VERSION" \
            -e OPENSSL_VERSION="$openssl_ver" \
            -e ZLIB_VERSION="$zlib_ver" \
            -e DISTRO="${{ matrix.distro }}" \
            -e EXPECTED_ARCH="${{ matrix.arch }}" \
            "trust-binary/openssh-build:${{ matrix.distro }}" \
            bash /opt/trust-binary/build.sh
          ls -l dist

      - name: 提取失败原因并写入 annotation
        if: failure()
        run: |
          set -euo pipefail
          log="$PWD/dist/build.log"
          if [ ! -f "$log" ]; then
            echo "未找到 dist/build.log"
            exit 0
          fi
          echo "===== 关键错误行 ====="
          grep -nE 'error:|fatal error|Error [0-9]+|undefined reference|No rule to make target|configure: error|command not found' "$log" | tail -n 25 || true
          summary="$(grep -E 'error:|fatal error|undefined reference|No rule to make target|configure: error|command not found' "$log" | tail -n 3 | tr '\n' ' ' | cut -c1-900 || true)"
          if [ -n "$summary" ]; then
            echo "::error title=构建失败 (${{ matrix.distro }}-${{ matrix.arch }})::$summary"
          fi

      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            dist/build.log
            dist/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: openssh-${{ needs.resolve.outputs.openssh_version }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: 生成构建来源证明（可选，需仓库变量 ENABLE_ATTESTATION=true）
        if: vars.ENABLE_ATTESTATION == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

  test:
    name: 冒烟测试 (${{ matrix.distro }}-${{ matrix.arch }})
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu18.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:18.04
          - distro: ubuntu20.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:20.04
          - distro: ubuntu22.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:22.04
          - distro: ubuntu24.04
            arch: x86_64
            runner: ubuntu-latest
            base_image: ubuntu:24.04
          - distro: centos7
            arch: x86_64
            runner: ubuntu-latest
            base_image: centos:7
          - distro: rocky9
            arch: x86_64
            runner: ubuntu-latest
            base_image: rockylinux:9
          - distro: ubuntu18.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:18.04
          - distro: ubuntu20.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:20.04
          - distro: ubuntu22.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:22.04
          - distro: ubuntu24.04
            arch: aarch64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
            base_image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openssh-${{ needs.resolve.outputs.openssh_version }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: artifact

      - name: 拉取运行时镜像（带镜像站回退）
        run: |
          set -euo pipefail
          image="${{ matrix.base_image }}"
          if ! docker pull "$image"; then
            mirror_image="mirror.gcr.io/library/${image#docker.io/library/}"
            echo "Docker Hub 拉取失败，回退到 $mirror_image"
            docker pull "$mirror_image"
            docker tag "$mirror_image" "$image"
          fi

      - name: 在 ${{ matrix.distro }}-${{ matrix.arch }} 中运行冒烟测试
        env:
          VERSION: ${{ needs.resolve.outputs.openssh_version }}
        run: |
          set -euo pipefail
          openssl_ver="$(python3 -c 'import glob,json; print(json.load(open(glob.glob("artifact/*.build-info.json")[0]))["dependencies"]["openssl"])')"
          set +e
          docker run --rm \
            -v "$PWD/artifact:/artifact:ro" \
            -v "$PWD/components/openssh/smoke-test.sh:/smoke-test.sh:ro" \
            -e OPENSSH_VERSION="$VERSION" \
            -e OPENSSL_VERSION="$openssl_ver" \
            "${{ matrix.base_image }}" \
            bash /smoke-test.sh 2>&1 | tee smoke-test.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            summary="$(grep -E 'FAIL:|\[emerg\]|\[alert\]|sshd:|ssh:|ERROR|not found|error while loading|Permission denied' smoke-test.log | tail -n 5 | tr '\n' ' ' | cut -c1-1200 || true)"
            [ -n "$summary" ] || summary="$(tail -n 3 smoke-test.log | tr '\n' ' ' | cut -c1-900 || true)"
            echo "::error title=冒烟测试失败 (${{ matrix.distro }}-${{ matrix.arch }})::$summary"
            exit "$rc"
          fi

  release:
    name: 发布 GitHub Release
    needs: [resolve, test]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物与校验和
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/openssh-*/; do
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                *.tar.gz|*.build-info.json) cp "$f" release/ ;;
                *) echo "跳过: $f" ;;
              esac
            done
          done
          cp artifacts/sources/source-metadata.json release/
          cp artifacts/sources/openssh.lock.resolved.json release/
          ( cd release && sha256sum ./* > SHA256SUMS )
          echo "发布资产:"; ls -l release

      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.resolve.outputs.openssh_version }}
        run: |
          set -euo pipefail
          bash scripts/render-openssh-release-notes.sh "$VERSION" artifacts release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.openssh_version }}
        run: |
          set -euo pipefail
          tag="openssh-${VERSION}"
          shopt -s nullglob
          assets=(release/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "没有可发布的资产" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "OpenSSH ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" \
              --title "OpenSSH ${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

      - name: 回写 lockfile（尽力而为）
        continue-on-error: true
        env:
          VERSION: ${{ needs.resolve.outputs.openssh_version }}
        run: |
          set -euo pipefail
          resolved="artifacts/sources/openssh.lock.resolved.json"
          [ -f "$resolved" ] || { echo "未找到 resolved lockfile，跳过"; exit 0; }
          current="$(python3 scripts/lockfile.py get lock/openssh.lock.json openssh version)"
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
          if [ "$newest" != "$VERSION" ]; then
            echo "本次为旧版本 ${VERSION} 的显式重建，不更新 lockfile"
            exit 0
          fi
          cp "$resolved" lock/openssh.lock.json
          if git diff --quiet -- lock/openssh.lock.json; then
            echo "lockfile 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lock/openssh.lock.json
          git commit -m "chore(openssh): 锁定 ${VERSION} 源码 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
